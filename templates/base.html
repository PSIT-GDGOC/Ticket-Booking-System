
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Ticketly | Event Booking{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-light bg-white sticky-top border-bottom">
    <div class="container py-2">
        <a class="navbar-brand fw-bold brand" href="/">
            <span class="brand-icon">T</span> Ticketly
        </a>

        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse" data-bs-target="#mainNavbar"
                aria-controls="mainNavbar" aria-expanded="false"
                aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNavbar">
            <ul class="navbar-nav mx-auto gap-lg-3">
                <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="/#events">Explore Events</a></li>
                <li class="nav-item"><a class="nav-link" href="/bookings/">My Bookings</a></li>
            </ul>

            <div class="d-flex gap-2 mt-3 mt-lg-0">
                <a href="/users/login/" class="btn btn-outline-primary rounded-pill px-4">
                    Login
                </a>
                <a href="/users/register/" class="btn btn-primary rounded-pill px-4">
                    Sign Up
                </a>
            </div>
        </div>
    </div>
</nav>

<main>
    {% block content %}{% endblock %}
</main>

<footer class="site-footer mt-5">
    <div class="container py-4 d-flex flex-column flex-md-row
                justify-content-between align-items-center gap-2">
        <div class="fw-bold brand">Ticketly</div>
        <p class="mb-0 text-secondary small">
            Discover events. Make memories.
        </p>
        <p class="mb-0 text-secondary small">
            © 2026 Ticketly
        </p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
